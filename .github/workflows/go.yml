name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - name: Check formatting
        run: |
          unformatted_files=$(gofmt -l .)
          if [ -n "$unformatted_files" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted_files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -shuffle=on -count=10 -timeout=2m ./...
      - name: Test assembly experiment
        run: go test -tags=nsync_spin -race -shuffle=on -count=3 -timeout=2m ./...
      - name: Test as 32-bit x86
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test -shuffle=on -count=3 -timeout=2m ./...
      - name: Cross-compile common architectures
        if: matrix.os == 'ubuntu-latest'
        run: ./benchmarks/cross-build.sh
